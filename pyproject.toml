[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl3d"
version = "0.1.0"
description = "Mechanism design toolkit (links, revolute/prismatic pairs, mobility) for PythonSCAD"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harada-aaa" }]
keywords = ["pythonscad", "openscad", "mechanism", "kinematics", "linkage", "dof"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[tool.setuptools.packages.find]
include = ["ctrl3d*"]

[tool.setuptools.package-data]
ctrl3d = ["py.typed"]
